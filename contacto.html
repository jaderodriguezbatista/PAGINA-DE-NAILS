<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- ============================================
         ZONA EDITABLE #1: Identidad del negocio
         ============================================ -->
    <title>Contacto | GLOW NAILS STUDIO</title>
    <meta name="description" content="Contacta a GLOW NAILS STUDIO y reserva tu cita para manicura, uñas acrílicas o nail art.">
    <meta property="og:title" content="Contacto | GLOW NAILS STUDIO">
    <meta property="og:description" content="Reserva tu cita ahora.">
    <meta property="og:type" content="website">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💅</text></svg>">

    <style>
        /* ============================================
           ZONA EDITABLE #2: Marca visual
           Debe coincidir con index.html y servicios.html
           ============================================ */
        :root {
            --color-primario: #d63384;
            --color-secundario: #a855f7;
            --color-whatsapp: #25D366;
            --fondo-inicio: #ffd6ec;
            --fondo-fin: #d9c2ff;
            --texto-oscuro: #222;
            --fuente: Arial, sans-serif;
        }

        body {
            margin: 0;
            font-family: var(--fuente);
            background: linear-gradient(135deg, var(--fondo-inicio), var(--fondo-fin));
            color: var(--texto-oscuro);
            text-align: center;
        }

        nav {
            background: rgba(255, 255, 255, 0.85);
            padding: 15px 20px;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 1000;
            backdrop-filter: blur(10px);
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
        }

        nav a {
            color: var(--texto-oscuro);
            text-decoration: none;
            margin: 0 15px;
            font-size: 16px;
            font-weight: bold;
            display: inline-block;
            padding: 8px 12px;
            border-radius: 20px;
            transition: 0.3s;
        }

        nav a:hover {
            color: white;
            background: var(--color-primario);
        }

        .contenido {
            padding: 60px 20px;
        }

        h1 {
            font-size: 50px;
            margin-bottom: 10px;
        }

        .subtitulo {
            font-size: 20px;
            margin-bottom: 40px;
        }

        .contacto {
            background: white;
            max-width: 600px;
            margin: auto;
            padding: 40px;
            border-radius: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
            box-sizing: border-box;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        label {
            text-align: left;
            font-weight: bold;
        }

        input,
        textarea,
        select {
            padding: 14px;
            border: 1px solid #ddd;
            border-radius: 12px;
            font-size: 16px;
            font-family: var(--fuente);
            box-sizing: border-box;
            width: 100%;
        }

        textarea {
            min-height: 130px;
            resize: vertical;
        }

        button {
            background: var(--color-primario);
            color: white;
            border: none;
            padding: 15px;
            border-radius: 30px;
            font-size: 18px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            transform: scale(1.03);
        }

        .whatsapp {
            display: inline-block;
            margin-top: 25px;
            background: var(--color-whatsapp);
            color: white;
            text-decoration: none;
            padding: 15px 25px;
            border-radius: 30px;
            font-weight: bold;
            transition: 0.3s;
        }

        .whatsapp:hover {
            transform: scale(1.03);
        }

        /* Footer: agregado para consistencia con index.html y servicios.html */
        footer {
            background: linear-gradient(135deg, var(--color-primario), var(--color-secundario));
            color: white;
            text-align: center;
            padding: 30px 20px;
            margin-top: 50px;
        }

        footer h3 {
            font-size: 24px;
            margin-bottom: 10px;
        }

        footer p {
            margin: 8px 0;
            font-size: 15px;
        }

        @media (max-width: 700px) {

            h1 {
                font-size: 38px;
            }

            nav a {
                margin: 0 8px;
                font-size: 15px;
            }

            .contacto {
                padding: 25px;
            }
        }
    </style>
</head>

<body>

    <nav>
        <a href="index.html">Inicio</a>
        <a href="servicios.html">Servicios</a>
        <a href="galeria.html">Galería</a>
        <a href="contacto.html">Contacto</a>
    </nav>

    <main class="contenido">

        <h1>Contáctanos 💌</h1>

        <p class="subtitulo">
            ¿Lista para darle un glow a tus uñas? ✨
        </p>

        <div class="contacto">

            <form id="formularioReserva">

                <label for="nombre">Nombre</label>
                <input
                    type="text"
                    id="nombre"
                    placeholder="Escribe tu nombre"
                    required
                >

                <label for="telefono">Teléfono</label>
                <input
                    type="tel"
                    id="telefono"
                    placeholder="Tu número de teléfono"
                    required
                >

                <!-- ZONA EDITABLE #3: Servicios y precios
                     Deben coincidir con servicios.html -->
                <label for="servicio">Servicio</label>
                <select id="servicio" required>
                    <option value="">Selecciona un servicio</option>
                    <option value="Manicura">💅 Manicura - RD$ 800</option>
                    <option value="Uñas acrílicas">✨ Uñas acrílicas - RD$ 1,500</option>
                    <option value="Nail Art">🌸 Nail Art - Desde RD$ 500</option>
                </select>

                <label for="mensaje">Mensaje</label>
                <textarea
                    id="mensaje"
                    placeholder="Escribe algún detalle adicional..."
                    required
                ></textarea>

                <button type="submit">
                    Enviar reserva 💖
                </button>

            </form>

            <!-- El href se rellena automáticamente por el script, tomando
                 el número de WHATSAPP_NUMERO más abajo. No hace falta
                 tocar este link a mano. -->
            <a
                class="whatsapp"
                id="linkWhatsapp"
                href="#"
                target="_blank"
            >
                💬 Reservar por WhatsApp
            </a>

        </div>

    </main>

    <footer>
        <h3>GLOW NAILS STUDIO</h3>
        <p>Diseños de uñas hechos con amor ✨</p>
        <p>© 2026 GLOW NAILS STUDIO - Todos los derechos reservados.</p>
    </footer>

<script>
    // ============================================
    // ZONA EDITABLE #4: Número de WhatsApp
    // Este es el ÚNICO lugar donde hay que cambiarlo.
    // Formato: código de país + número, sin espacios ni "+"
    // Ej: República Dominicana => 1 + 809 + número
    // ============================================
    const WHATSAPP_NUMERO = "18095555555";

    // Rellena el botón "Reservar por WhatsApp" con el número de arriba,
    // así solo se edita en un sitio.
    document.getElementById("linkWhatsapp").href =
        "https://wa.me/" + WHATSAPP_NUMERO;

    const parametros = new URLSearchParams(window.location.search);
    const servicioSeleccionado = parametros.get("servicio");

    if (servicioSeleccionado === "manicura") {
        document.getElementById("servicio").value = "Manicura";
    }

    if (servicioSeleccionado === "acrilicas") {
        document.getElementById("servicio").value = "Uñas acrílicas";
    }

    if (servicioSeleccionado === "nailart") {
        document.getElementById("servicio").value = "Nail Art";
    }

    document.getElementById("formularioReserva").addEventListener("submit", function (event) {

        event.preventDefault();

        const nombre = document.getElementById("nombre").value;
        const telefono = document.getElementById("telefono").value;
        const servicio = document.getElementById("servicio").value;
        const mensaje = document.getElementById("mensaje").value;

        const texto =
            "Hola, quiero reservar en GLOW NAILS STUDIO 💅\n\n" +
            "👤 Nombre: " + nombre + "\n" +
            "📱 Teléfono: " + telefono + "\n" +
            "💅 Servicio: " + servicio + "\n" +
            "💌 Mensaje: " + mensaje;

        // encodeURIComponent protege contra caracteres especiales
        // (&, %, acentos, emojis) que antes podían romper el link
        window.open(
            "https://wa.me/" + WHATSAPP_NUMERO + "?text=" + encodeURIComponent(texto),
            "_blank"
        );

    });

</script>
</body>

</html>
