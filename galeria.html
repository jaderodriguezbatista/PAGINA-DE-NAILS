<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Galería | GLOW NAILS STUDIO</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #ffd6ec, #d9c2ff);
            color: #222;
            text-align: center;
        }

      nav {
    background: rgba(255, 255, 255, 0.85);
    padding: 15px 20px;
    text-align: center;
    position: sticky;
    top: 0;
    z-index: 1000;
    backdrop-filter: blur(10px);
    box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
}

      nav a {
    color: #222;
    text-decoration: none;
    margin: 0 15px;
    font-size: 16px;
    font-weight: bold;
    display: inline-block;
    padding: 8px 12px;
    border-radius: 20px;
    transition: 0.3s;
}

        nav a:hover {
    color: white;
    background: #d63384;
}

        .contenido {
            padding: 60px 20px;
        }

        h1 {
            font-size: 50px;
            margin-bottom: 10px;
        }

        .subtitulo {
            font-size: 20px;
            margin-bottom: 40px;
        }

        .galeria {
            max-width: 1000px;
            margin: auto;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 25px;
        }

        .foto {
    background: white;
    padding: 10px;
    border-radius: 20px;
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.12);
    overflow: hidden;
    transition: 0.3s;
}

.foto:hover {
    transform: translateY(-8px);
}

       .foto img {
    width: 100%;
    height: 300px;
    object-fit: cover;
    display: block;
    border-radius: 15px;
}
        @media (max-width: 700px) {

            .galeria {
                grid-template-columns: 1fr;
            }

            h1 {
                font-size: 38px;
            }

            nav a {
                margin: 0 8px;
                font-size: 15px;
            }
        }
    </style>
</head>

<body>

    <nav>
        <a href="index.html">Inicio</a>
        <a href="servicios.html">Servicios</a>
        <a href="galeria.html">Galería</a>
        <a href="contacto.html">Contacto</a>
    </nav>

    <main class="contenido">

        <h1>Nuestra Galería 💅✨</h1>

        <p class="subtitulo">
            Algunos diseños para inspirarte 💖
        </p>

        <div class="galeria">

            <div class="foto">
                <img src="imagenes/foto1.jpeg" alt="Diseño de uñas 1">
            </div>

            <div class="foto">
                <img src="imagenes/foto2.jpeg" alt="Diseño de uñas 2">
            </div>

            <div class="foto">
                <img src="imagenes/foto3.jpeg" alt="Diseño de uñas 3">
            </div>

            <div class="foto">
                <img src="imagenes/foto4.jpeg" alt="Diseño de uñas 4">
            </div>

            <div class="foto">
                <img src="imagenes/foto5.jpeg" alt="Diseño de uñas 5">
            </div>

            <div class="foto">
                <img src="imagenes/foto6.jpeg" alt="Diseño de uñas 6">
            </div>

        </div>

    </main>
<script>

    const fotos = document.querySelectorAll(".foto img");

    fotos.forEach(function(foto) {

        foto.addEventListener("click", function() {

            const fondo = document.createElement("div");

            fondo.style.position = "fixed";
            fondo.style.top = "0";
            fondo.style.left = "0";
            fondo.style.width = "100%";
            fondo.style.height = "100%";
            fondo.style.background = "rgba(0, 0, 0, 0.8)";
            fondo.style.display = "flex";
            fondo.style.justifyContent = "center";
            fondo.style.alignItems = "center";
            fondo.style.zIndex = "2000";
            fondo.style.cursor = "pointer";

            const imagenGrande = document.createElement("img");

            imagenGrande.src = foto.src;

            imagenGrande.style.maxWidth = "90%";
            imagenGrande.style.maxHeight = "85%";
            imagenGrande.style.objectFit = "contain";
            imagenGrande.style.borderRadius = "20px";

            fondo.appendChild(imagenGrande);

            document.body.appendChild(fondo);

            fondo.addEventListener("click", function() {
                fondo.remove();
            });

        });

    });

</script>
</body>

</html>
